apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: attendance
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: attendance-management
spec:
  accessModes:
    - ReadWriteOnce
  # 事前インストール済みのlocal-path-provisionerを使用する
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
