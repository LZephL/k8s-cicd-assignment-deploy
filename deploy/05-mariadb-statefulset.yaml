apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: attendance
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: attendance-management
spec:
  # 03-mariadb-service.yamlのService名と合わせる
  serviceName: mariadb
  # 1個のPVCを共有しないよう、この演習では1 Podに固定する
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: attendance-management
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mariadb
          # 演習中に意図しないバージョン変更が起きないよう固定する
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          # DB名とユーザー名はConfigMap、パスワードはSecretから取得する
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: attendance-config
                  key: MARIADB_DATABASE
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef:
                  name: attendance-config
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: MARIADB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: MARIADB_ROOT_PASSWORD

          # MariaDBが接続を受け付けられる状態になってからReadyにする
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mariadb-admin ping -h 127.0.0.1 -uroot -p"${MARIADB_ROOT_PASSWORD}" --silent'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          # MariaDBコンテナが使用するCPUとメモリの目安を設定する
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

          # 04-mariadb-pvc.yamlのPVCをMariaDBのデータ領域へ割り当てる
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data
