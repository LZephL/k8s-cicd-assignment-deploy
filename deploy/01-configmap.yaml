apiVersion: v1
kind: ConfigMap
metadata:
  name: attendance-config
  namespace: attendance
  labels:
    app.kubernetes.io/part-of: attendance-management
data:
  # Spring Bootの起動設定
  APP_NAME: attendance-kubernetes
  LOG_LEVEL: INFO
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  SERVER_ADDRESS: "0.0.0.0"
  SESSION_COOKIE_NAME: ATTENDANCE_K8S_SESSION

  # MariaDBへの接続設定
  DB_URL: "jdbc:mariadb://mariadb:3306/attendance?useUnicode=true&characterEncoding=utf8"
  DB_USER: attendance_app
  DB_DRIVER: org.mariadb.jdbc.Driver
  SHOW_SQL: "false"

  # 研修用初期ユーザーを登録する
  APP_SEED_ENABLED: "true"

  # MariaDBの初期化設定
  MARIADB_DATABASE: attendance
  MARIADB_USER: attendance_app
